<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encriptador</title>
<style>
:root{--fg:#eaffee;--glow:#00ff66;--line:rgba(60,255,130,.28)}
html,body{height:100%;margin:0}
body{color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(ellipse at 50% 30%,#0b4a24 0%,#05200f 55%,#010805 100%);background-attachment:fixed}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.9}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.65) 100%)}
.screen{display:none;min-height:100%;box-sizing:border-box;position:relative;z-index:1}
.screen.on{display:block}
#home.on{display:flex;flex-direction:column;height:100%}
h1{margin:0;padding:26px 22px 20px;text-align:center;font-size:30px;letter-spacing:4px;color:var(--fg);text-shadow:0 0 12px var(--glow),0 0 30px rgba(0,255,102,.5)}
.pair{flex:1;display:flex;gap:28px;padding:0 28px 28px;position:relative}
.opt{flex:1;border:1px solid rgba(255,255,255,.18);border-radius:26px;color:#fff;font-size:36px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:inherit;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.opt small{font-size:16px;font-weight:400;opacity:.92}
.opt.r{background:linear-gradient(145deg,#ff3b4a,#a80f1c);box-shadow:0 0 40px rgba(255,59,74,.35)}
.opt.b{background:linear-gradient(145deg,#3b8cff,#0f4aae);box-shadow:0 0 40px rgba(59,140,255,.35)}
.opt.r:hover{transform:scale(1.025);box-shadow:0 0 60px rgba(255,59,74,.6)}
.opt.b:hover{transform:scale(1.025);box-shadow:0 0 60px rgba(59,140,255,.6)}
.or{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 0 22px rgba(255,255,255,.55);pointer-events:none}
.panel{max-width:760px;margin:28px auto;padding:26px;border-radius:22px;background:rgba(3,18,9,.74);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 0 50px rgba(0,255,100,.14)}
.back{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--fg);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:15px;font-family:inherit;transition:background .2s}
.back:hover{background:rgba(60,255,130,.15)}
.panel h2{margin:10px 0 6px;text-shadow:0 0 12px rgba(0,255,102,.55)}
.panel p{margin:0 0 14px;opacity:.82}
textarea{width:100%;box-sizing:border-box;min-height:100px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:var(--fg);font-size:18px;font-family:inherit;resize:vertical;outline:none;transition:box-shadow .2s,border-color .2s}
textarea:focus{border-color:var(--glow);box-shadow:0 0 16px rgba(0,255,102,.35)}
.go{margin-top:12px;border:0;color:#fff;padding:12px 30px;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .2s}
.go:hover{transform:translateY(-2px)}
.go.r{background:linear-gradient(145deg,#ff3b4a,#b3121f);box-shadow:0 0 18px rgba(255,59,74,.4)}
.go.b{background:linear-gradient(145deg,#3b8cff,#1250b8);box-shadow:0 0 18px rgba(59,140,255,.4)}
.msg{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid #ff6b60;background:rgba(179,38,30,.22);color:#ffb3ac;display:none}
.step{margin-top:16px;padding:14px;border-radius:12px;background:rgba(60,255,130,.1);border:1px solid var(--line);display:none}
.step b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.8px;opacity:.75;margin-bottom:6px}
.step code{font-size:24px;font-weight:700;word-break:break-all;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;color:#8dffb8;text-shadow:0 0 10px rgba(0,255,102,.6)}
.mono{font-size:84px;line-height:1;text-align:center;margin:8px 0 4px;user-select:none;filter:drop-shadow(0 0 14px rgba(0,255,102,.45))}
.mono.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="vignette"></div>

<section id="home" class="screen on">
  <h1>¿QUÉ PREFIERES?</h1>
  <div class="pair">
    <button class="opt r" onclick="go('enc')">Encriptar<small>Frase → código secreto</small></button>
    <button class="opt b" onclick="go('dec')">Desencriptar<small>Código secreto → frase</small></button>
    <div class="or">OR</div>
  </div>
</section>

<section id="enc" class="screen"><div class="panel">
  <button class="back" onclick="go('home')">← Volver</button>
  <div class="mono" id="monoEnc">🐵</div>
  <h2>Encriptar</h2>
  <p>Escribe cualquier frase: letras, números, espacios o caracteres especiales.</p>
  <textarea id="encIn" placeholder="Ejemplo: Cas"></textarea>
  <button class="go r" onclick="encriptar()">Encriptar</button>
  <div class="msg" id="encErr"></div>
  <div class="step" id="encS2"><b>Paso 2: resultado encriptado</b><code id="encS2v"></code></div>
</div></section>

<section id="dec" class="screen"><div class="panel">
  <button class="back" onclick="go('home')">← Volver</button>
  <div class="mono" id="monoDec">🙈</div>
  <h2>Desencriptar</h2>
  <p>Pega el texto encriptado (solo las letras k r m l p z b h c t).</p>
  <textarea id="decIn" placeholder="Ejemplo: mtkrrt"></textarea>
  <button class="go b" onclick="desencriptar()">Desencriptar</button>
  <div class="msg" id="decErr"></div>
  <div class="step" id="decS2"><b>Frase original</b><code id="decS2v"></code></div>
</div></section>

<script>
// ===== Fondo: lluvia de código =====
(function(){
  const cv=document.getElementById('rain'),cx=cv.getContext('2d');
  const SET='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const fs=18;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cols,drops,last=0,frames=0;
  function size(){
    cv.width=innerWidth;cv.height=innerHeight;
    cols=Math.ceil(cv.width/fs);
    drops=Array.from({length:cols},()=>Math.random()*-60);
  }
  size();addEventListener('resize',size);
  function frame(t){
    if(t-last>55){
      last=t;frames++;
      // desvanece lo anterior (deja la estela)
      cx.globalCompositeOperation='destination-out';
      cx.fillStyle='rgba(0,0,0,0.1)';
      cx.fillRect(0,0,cv.width,cv.height);
      cx.globalCompositeOperation='source-over';
      cx.font=fs+'px ui-monospace,Consolas,monospace';
      for(let i=0;i<cols;i++){
        const y=drops[i]*fs;
        if(y>0){
          const ch=SET[Math.floor(Math.random()*SET.length)];
          cx.shadowColor='#00ff66';cx.shadowBlur=10;
          cx.fillStyle=Math.random()<0.04?'#ffffff':'#7dffb0';
          cx.fillText(ch,i*fs,y);
        }
        if(y>cv.height&&Math.random()>0.975) drops[i]=0;
        drops[i]+=1;
      }
      cx.shadowBlur=0;
    }
    if(reduce&&frames>150) return;   // si el usuario pidió menos movimiento, se detiene
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// ===== Encriptador =====
// Tabla principal: cada carácter tiene un código de 2 dígitos (01 a 77)
const CHARS='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 áéíóúüñÁÉÍÓÚÜÑ';
// Paso 2: dígito 0..9 -> letra
const LETRAS='krmlpzbhct';
const $=id=>document.getElementById(id);

// Cambia el mono con una animación
function mono(id,emoji){
  const m=$(id);
  m.textContent=emoji;
  m.classList.remove('pop');
  void m.offsetWidth;
  m.classList.add('pop');
}

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  document.querySelectorAll('.msg,.step').forEach(e=>e.style.display='none');
  $('encIn').value='';$('decIn').value='';
  $('monoEnc').textContent='🐵';   // encriptar: empieza mirando
  $('monoDec').textContent='🙈';   // desencriptar: empieza tapándose los ojos
}
function error(id,t){const e=$(id);e.textContent='❌ '+t;e.style.display='block';}

function encriptar(){
  ['encErr','encS2'].forEach(i=>$(i).style.display='none');
  $('monoEnc').textContent='🐵';
  const t=$('encIn').value;
  if(!t) return error('encErr','Escribe una frase primero.');
  let p1='';
  for(const c of t){
    const i=CHARS.indexOf(c);
    if(i>=0) p1+=String(i+1).padStart(2,'0');                          // carácter normal: 2 dígitos
    else p1+='00'+String(c.codePointAt(0)).padStart(7,'0');            // especial: 00 + código Unicode (7 dígitos)
  }
  const p2=[...p1].map(d=>LETRAS[+d]).join('');
  $('encS2v').textContent=p2;
  $('encS2').style.display='block';
  mono('monoEnc','🙈');   // se tapa los ojos al encriptar
}

function desencriptar(){
  ['decErr','decS2'].forEach(i=>$(i).style.display='none');
  $('monoDec').textContent='🙈';
  const t=$('decIn').value.trim();
  if(!t) return error('decErr','Escribe el texto encriptado primero.');
  const malos=[...new Set([...t].filter(c=>!LETRAS.includes(c)))];
  if(malos.length) return error('decErr','Texto no válido: solo puede tener las letras '+[...LETRAS].join(' ')+'. Sobra: '+malos.join(' ')+'.');
  const p1=[...t].map(l=>LETRAS.indexOf(l)).join('');
  let out='',i=0;
  while(i<p1.length){
    const n=p1.slice(i,i+2);
    if(n.length<2) return error('decErr','Texto no válido: está incompleto.');
    if(n==='00'){
      const s=p1.slice(i+2,i+9);
      if(s.length<7) return error('decErr','Texto no válido: está incompleto.');
      const cp=parseInt(s,10);
      if(cp>0x10FFFF||(cp>=0xD800&&cp<=0xDFFF)) return error('decErr','Texto no válido: hay un código que no corresponde a ningún carácter.');
      out+=String.fromCodePoint(cp);
      i+=9;
    }else{
      const k=parseInt(n,10);
      if(k>CHARS.length) return error('decErr','Texto no válido: el código '+n+' no corresponde a ningún carácter.');
      out+=CHARS[k-1];
      i+=2;
    }
  }
  $('decS2v').textContent=out;
  $('decS2').style.display='block';
  mono('monoDec','🐵');   // abre los ojos al desencriptar
}
</script>
</body>
</html>
